<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Global Connect 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0A2540;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:#fff;border-radius:16px;padding:40px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:28px}
.logo h1{color:#0A2540;font-size:18px;font-weight:700;margin-top:8px}
.logo p{color:#6C757D;font-size:13px;margin-top:4px}
label{font-size:12px;font-weight:600;color:#495057;display:block;margin-bottom:6px}
.tinput{width:100%;padding:8px 12px;border:1px solid #DEE2E6;border-radius:8px;font-size:13px;font-family:monospace;outline:none;margin-bottom:4px}
.tinput:focus{border-color:#0A2540}
small{font-size:11px;color:#ADB5BD;display:block;margin-bottom:20px}
.drop{border:2px dashed #CBD0D8;border-radius:12px;padding:40px 24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px}
.drop:hover,.drop.drag{border-color:#0A2540;background:#F0F4FA}
.drop .ic{font-size:40px;margin-bottom:10px}
.drop h3{font-size:15px;color:#0A2540;margin-bottom:6px}
.drop p{font-size:12px;color:#6C757D}
.btn{display:block;width:100%;background:#0A2540;color:#F2C94C;border:none;padding:14px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.btn:hover{background:#185FA5}
.btn:disabled{background:#ADB5BD;color:#fff;cursor:not-allowed}
.finfo{background:#F8F9FA;border-radius:8px;padding:10px 14px;font-size:12px;color:#495057;margin-bottom:12px;display:none}
.status{border-radius:8px;padding:12px 16px;font-size:13px;margin-top:16px;display:none}
.ok{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7}
.err{background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5}
.loading{background:#EFF6FF;color:#1E40AF;border:1px solid #93C5FD}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #93C5FD;border-top-color:#1E40AF;border-radius:50%;animation:sp .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.debug{background:#F8F9FA;border:1px solid #DEE2E6;border-radius:8px;padding:10px 14px;font-size:11px;font-family:monospace;color:#495057;margin-top:12px;max-height:180px;overflow-y:auto;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div style="font-size:36px">🌐</div>
    <h1>Global Connect 2026</h1>
    <p>Panel de actualización — Solo administradores</p>
  </div>

  <label>GitHub Token (Personal Access Token)</label>
  <input type="password" class="tinput" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
  <small>Se guarda solo en esta sesión del navegador.</small>

  <div class="drop" id="drop"
    ondragover="event.preventDefault();this.classList.add('drag')"
    ondragleave="this.classList.remove('drag')"
    ondrop="onDrop(event)"
    onclick="document.getElementById('fi').click()">
    <div class="ic">📊</div>
    <h3>Subir Excel del día</h3>
    <p>Arrastrá el archivo acá o hacé clic para seleccionarlo</p>
    <input type="file" id="fi" accept=".xlsx,.xls" style="display:none" onchange="onFile(this.files[0])">
  </div>

  <div class="finfo" id="finfo"></div>
  <button class="btn" id="pubBtn" disabled onclick="publicar()">📤 Procesar y publicar</button>
  <div class="status" id="status"></div>
  <div class="debug" id="debug"></div>
</div>

<script>
var OWNER='mruizaguirre', REPO='globalconnect-edn', FILE='data.json';
var parsed=null;

function log(msg){
  var el=document.getElementById('debug');
  el.style.display='block';
  el.textContent+=msg+'\n';
}
function clr(v){ return String(v==null?'':v).replace(/\n/g,' ').trim(); }
function num(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
function pct(two,total){ return total>0?Math.round((two/total)*100):0; }

function onDrop(e){
  e.preventDefault();
  document.getElementById('drop').classList.remove('drag');
  onFile(e.dataTransfer.files[0]);
}

function onFile(file){
  if(!file)return;
  document.getElementById('debug').textContent='';
  var match=file.name.match(/(\d{2}-\d{2})/);
  var fecha='';
  if(match){
    var parts=match[1].split('-');
    var meses=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    fecha=parseInt(parts[0])+' de '+meses[parseInt(parts[1])]+' de 2026';
  } else {
    fecha=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  }

  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      log('Pestañas: '+wb.SheetNames.join(' | '));
      var resumen=parseResumen(wb);
      var modulo=parseModulo(wb);
      var dormis=parseDormis(wb);
      parsed={resumen:resumen,modulo:modulo,dormis:dormis,fecha:fecha};
      var fi=document.getElementById('finfo');
      fi.style.display='block';
      fi.innerHTML='✅ <strong>'+file.name+'</strong> · '
        +resumen.alumnosUnicos+' alumnos únicos · '
        +resumen.carreras.length+' carreras · '
        +Object.keys(modulo).length+' cursos'
        +(dormis?' · '+dormis.totalAlumnos+' dormis':'');
      document.getElementById('pubBtn').disabled=false;
      showStatus('Archivo procesado. Revisá el log y hacé clic en "Procesar y publicar".','ok');
    }catch(err){
      showStatus('❌ Error: '+err.message,'err');
      log('ERROR: '+err.message+'\n'+err.stack);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ─────────────────────────────────────────────────────────────
// RESUMEN TOTAL
// Estructura real del Excel:
//   Fila 4: col B = "  Módulo A", fila 11 = "  Módulo B"
//   Filas 5-8: col B=num, col C=nombre curso, col D=n (Módulo A)
//   Filas 12-15: ídem Módulo B
//   Fila 3: col G="Alumnos Unicos" → fila 4: col G=229, H=70, I=159
//   Fila 9: col G="Carrera" → filas 10+ tienen los datos
//   Fila 18: col C="TOTAL GENERAL", col D=totalGeneral (fórmula, ignorar)
//   Columna K (pct) tiene FÓRMULAS → calcular desde J/H
// ─────────────────────────────────────────────────────────────
function parseResumen(wb){
  var sn=wb.SheetNames.find(function(n){return /resumen total/i.test(n)});
  if(!sn) sn=wb.SheetNames.find(function(n){return /resumen/i.test(n)&&!/módulo/i.test(n)&&!/dormis/i.test(n)&&!/nombres/i.test(n)});
  if(!sn) throw new Error('No se encontró pestaña Resumen Total. Pestañas: '+wb.SheetNames.join(', '));
  log('Resumen Total → "'+sn+'"');

  var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});
  var alumnosUnicos=0,unCurso=0,dosCursos=0,totalGeneral=0;
  var cursosA=[],cursosB=[],carreras=[];
  var moduloActual=null;

  for(var i=0;i<rows.length;i++){
    var c=rows[i].map(clr);

    // ── Módulo A / B (col B, idx 1) ──
    if(/^\s*m[oó]dulo\s*a\s*$/i.test(c[1])){ moduloActual='A'; continue; }
    if(/^\s*m[oó]dulo\s*b\s*$/i.test(c[1])){ moduloActual='B'; continue; }

    // ── Alumnos únicos: header en col G (idx 6) ──
    if(/alumnos\s+uni/i.test(c[6])){
      if(i+1<rows.length){
        var nr=rows[i+1].map(clr);
        alumnosUnicos=parseInt(nr[6])||0;
        unCurso=parseInt(nr[7])||0;
        dosCursos=parseInt(nr[8])||0;
        log('Alumnos únicos='+alumnosUnicos+' 1c='+unCurso+' 2c='+dosCursos);
      }
    }

    // ── Total general: col C (idx 2) ──
    if(/total\s+general/i.test(c[2])){
      // col D puede ser fórmula; usar suma de cursosA+cursosB después
      var raw=rows[i][3];
      if(typeof raw === 'number') totalGeneral=raw;
    }

    // ── Cursos: col B = número 1-9, col C = nombre, col D = inscriptos ──
    if(moduloActual && /^[1-9]$/.test(c[1]) && c[2] && c[2].length>3){
      var n=typeof rows[i][3]==='number'?rows[i][3]:(parseInt(c[3])||0);
      if(n>0){
        if(moduloActual==='A') cursosA.push({nombre:c[2],n:n});
        else cursosB.push({nombre:c[2],n:n});
      }
    }

    // ── Carreras: header en col G = "Carrera" ──
    if(c[6]==='Carrera'){
      log('Header Carrera en fila '+(i+1));
      for(var j=i+1;j<rows.length;j++){
        var cr=rows[j];
        var nombre=clr(cr[6]);
        if(!nombre) continue;
        if(/^(carrera|global|total)/i.test(nombre)) continue;
        var total=typeof cr[7]==='number'?cr[7]:(parseInt(clr(cr[7]))||0);
        if(total<=0) continue;
        var one  =typeof cr[8]==='number'?cr[8]:(parseInt(clr(cr[8]))||0);
        var two  =typeof cr[9]==='number'?cr[9]:(parseInt(clr(cr[9]))||0);
        // col K (idx 10) puede ser fórmula string → calcular
        var pctVal=pct(two,total);
        log('  '+nombre+' t='+total+' 1c='+one+' 2c='+two+' pct='+pctVal+'%');
        carreras.push({carrera:nombre,total:total,one:one,two:two,pct:pctVal});
      }
      break; // ya leímos todas
    }
  }

  // totalGeneral: si quedó 0 (fórmula), sumarlo
  if(!totalGeneral) totalGeneral=cursosA.reduce(function(s,c){return s+c.n},0)+cursosB.reduce(function(s,c){return s+c.n},0);
  log('Carreras='+carreras.length+' cursosA='+cursosA.length+' cursosB='+cursosB.length);
  return{alumnosUnicos:alumnosUnicos,unCurso:unCurso,dosCursos:dosCursos,totalGeneral:totalGeneral,cursosA:cursosA,cursosB:cursosB,carreras:carreras};
}

// ─────────────────────────────────────────────────────────────
// RESUMEN POR MÓDULO
// Estructura real:
//   Fila 3: col A = "Módulo A"
//   Fila 4: col A = "Nombre Curso | Prof. Apellido Nombre"
//   Fila 5: header (Prioridad, Apellido, Nombre, Email, Carrera)
//   Filas 6+: alumnos, col A="1° Prioridad", B=apellido, C=nombre, D=email, E=carrera
//   Siguiente módulo comienza con "Módulo B" en col A
// ─────────────────────────────────────────────────────────────
function parseModulo(wb){
  var sn=wb.SheetNames.find(function(n){return /resumen por m[oó]dulo/i.test(n)});
  if(!sn){ log('Sin pestaña módulos'); return {}; }
  log('Módulos → "'+sn+'"');
  var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});
  var cursos={},cursoActual=null,modActual=null;

  for(var i=0;i<rows.length;i++){
    var c=rows[i].map(clr);
    if(!c.join('').trim()) continue;

    var a=c[0]; // col A

    // Módulo A / B
    if(/^m[oó]dulo\s*a\s*$/i.test(a)){ modActual='A'; cursoActual=null; continue; }
    if(/^m[oó]dulo\s*b\s*$/i.test(a)){ modActual='B'; cursoActual=null; continue; }

    // Encabezado de curso: tiene "|" y NO empieza con "1°" ni "Prioridad"
    if(a && a.indexOf('|')>=0 && !/^(1[°º]|Prioridad)/i.test(a)){
      var parts=a.split('|');
      cursoActual=parts[0].trim();
      var prof=parts[1]?parts[1].trim():'';
      cursos[cursoActual]={modulo:modActual,profesor:prof,alumnos:[]};
      continue;
    }

    // Fila de alumno: col A empieza con "1°" o "1º"
    if(/^1[°º]/i.test(a) && cursoActual && cursos[cursoActual]){
      cursos[cursoActual].alumnos.push({
        apellido:c[1], nombre:c[2], email:c[3], carrera:c[4]
      });
    }
  }
  log('Cursos: '+Object.keys(cursos).join(', '));
  return cursos;
}

// ─────────────────────────────────────────────────────────────
// DORMIS
// ─────────────────────────────────────────────────────────────
function parseDormis(wb){
  var snR=wb.SheetNames.find(function(n){return /resumen dormis/i.test(n)});
  var snN=wb.SheetNames.find(function(n){return /con nombres/i.test(n)});
  if(!snR&&!snN){ log('Sin pestañas dormis'); return null; }
  log('Dormis resumen="'+(snR||'—')+'" nombres="'+(snN||'—')+'"');

  var baseSimple=0,baseDoble=0,totalRes=0,totalAlum=0;
  var bloques=[],carrerasDormis=[],alumnos=[];

  if(snR){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[snR],{header:1,defval:null,raw:true});
    var hf=false;
    for(var i=0;i<rows.length;i++){
      var c=rows[i].map(clr);
      if(/^bloque$/i.test(c[0])){ hf=true; continue; }
      if(hf&&/^total$/i.test(c[0])){
        baseSimple=typeof rows[i][1]==='number'?rows[i][1]:(parseInt(c[1])||0);
        baseDoble =typeof rows[i][2]==='number'?rows[i][2]:(parseInt(c[2])||0);
        totalRes  =typeof rows[i][3]==='number'?rows[i][3]:(parseInt(c[3])||0);
        totalAlum =typeof rows[i][4]==='number'?rows[i][4]:(parseInt(c[4])||0);
        continue;
      }
      if(hf&&c[0]&&c[0].length>2&&!/^total$/i.test(c[0])){
        var bs=typeof rows[i][1]==='number'?rows[i][1]:(parseInt(c[1])||0);
        var bd=typeof rows[i][2]==='number'?rows[i][2]:(parseInt(c[2])||0);
        if(bs+bd>0) bloques.push({
          bloque:c[0],simple:bs,doble:bd,
          reservas:typeof rows[i][3]==='number'?rows[i][3]:(parseInt(c[3])||0),
          alumnos:typeof rows[i][4]==='number'?rows[i][4]:(parseInt(c[4])||0)
        });
      }
      // Carreras dormis en col H+ (idx 7)
      var cNombre=clr(rows[i][7]);
      if(cNombre&&cNombre.length>3&&!/^(carrera|global|total)/i.test(cNombre)){
        var cant=typeof rows[i][8]==='number'?rows[i][8]:(parseInt(clr(rows[i][8]))||0);
        var cantTotal=totalAlum||27; // fallback
        var pctD=pct(cant,cantTotal);
        if(cant>0) carrerasDormis.push({carrera:cNombre,cant:cant,pct:pctD});
      }
    }
  }

  if(snN){
    var rows2=XLSX.utils.sheet_to_json(wb.Sheets[snN],{header:1,defval:null,raw:true});
    var hf2=false;
    for(var j=0;j<rows2.length;j++){
      var c2=rows2[j].map(clr);
      if(/^apellido/i.test(c2[0])){ hf2=true; continue; }
      if(!hf2||!c2[0]||/^total/i.test(c2[0])) continue;
      alumnos.push({nombre:c2[0],email:c2[1],bloque:c2[2],tipo:c2[3],acompanante:c2[4]||'',observaciones:c2[5]||''});
    }
    log('Alumnos dormis: '+alumnos.length);
  }

  return{baseSimple:baseSimple,baseDoble:baseDoble,totalReservas:totalRes,totalAlumnos:totalAlum,bloques:bloques,carreras:carrerasDormis,alumnos:alumnos};
}

async function publicar(){
  var token=document.getElementById('token').value.trim();
  if(!token){ showStatus('⚠️ Ingresá tu GitHub Token primero.','err'); return; }
  if(!parsed){ showStatus('⚠️ Primero subí el Excel.','err'); return; }

  document.getElementById('pubBtn').disabled=true;
  showStatus('<span class="spin"></span> Publicando en GitHub...','loading');

  try{
    var content=btoa(unescape(encodeURIComponent(JSON.stringify(parsed,null,2))));
    var url='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+FILE;
    var sha=null;
    try{
      var r=await fetch(url,{headers:{Authorization:'token '+token}});
      if(r.ok){ var dd=await r.json(); sha=dd.sha; }
    }catch(e){}

    var body={message:'Actualización datos '+parsed.fecha,content:content};
    if(sha) body.sha=sha;

    var res=await fetch(url,{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok){ var er=await res.json(); throw new Error(er.message||res.statusText); }

    showStatus('✅ Dashboard actualizado con datos del <strong>'+parsed.fecha+'</strong>.<br>'
      +'Visible en 1-2 min en: <a href="https://'+OWNER+'.github.io/'+REPO+'/" target="_blank" style="color:#065F46">https://'+OWNER+'.github.io/'+REPO+'/</a>','ok');
  }catch(err){
    showStatus('❌ Error al publicar: '+err.message,'err');
  }
  document.getElementById('pubBtn').disabled=false;
}

function showStatus(msg,type){
  var el=document.getElementById('status');
  el.className='status '+type;
  el.innerHTML=msg;
  el.style.display='block';
}
</script>
</body>
</html>
