<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Global Connect 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0A2540;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:#fff;border-radius:16px;padding:40px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:28px}
.logo h1{color:#0A2540;font-size:18px;font-weight:700;margin-top:8px}
.logo p{color:#6C757D;font-size:13px;margin-top:4px}
label{font-size:12px;font-weight:600;color:#495057;display:block;margin-bottom:6px}
.tinput{width:100%;padding:8px 12px;border:1px solid #DEE2E6;border-radius:8px;font-size:13px;font-family:monospace;outline:none;margin-bottom:4px}
.tinput:focus{border-color:#0A2540}
small{font-size:11px;color:#ADB5BD;display:block;margin-bottom:20px}
.drop{border:2px dashed #CBD0D8;border-radius:12px;padding:40px 24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px}
.drop:hover,.drop.drag{border-color:#0A2540;background:#F0F4FA}
.drop .ic{font-size:40px;margin-bottom:10px}
.drop h3{font-size:15px;color:#0A2540;margin-bottom:6px}
.drop p{font-size:12px;color:#6C757D}
.btn{display:block;width:100%;background:#0A2540;color:#F2C94C;border:none;padding:14px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.btn:hover{background:#185FA5}
.btn:disabled{background:#ADB5BD;color:#fff;cursor:not-allowed}
.finfo{background:#F8F9FA;border-radius:8px;padding:10px 14px;font-size:12px;color:#495057;margin-bottom:12px;display:none}
.status{border-radius:8px;padding:12px 16px;font-size:13px;margin-top:16px;display:none}
.ok{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7}
.err{background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5}
.loading{background:#EFF6FF;color:#1E40AF;border:1px solid #93C5FD}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #93C5FD;border-top-color:#1E40AF;border-radius:50%;animation:sp .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.debug{background:#F8F9FA;border:1px solid #DEE2E6;border-radius:8px;padding:10px 14px;font-size:11px;font-family:monospace;color:#495057;margin-top:12px;max-height:200px;overflow-y:auto;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div style="font-size:36px">🌐</div>
    <h1>Global Connect 2026</h1>
    <p>Panel de actualización — Solo administradores</p>
  </div>

  <label>GitHub Token (Personal Access Token)</label>
  <input type="password" class="tinput" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
  <small>Se guarda solo en esta sesión del navegador.</small>

  <div class="drop" id="drop"
    ondragover="event.preventDefault();this.classList.add('drag')"
    ondragleave="this.classList.remove('drag')"
    ondrop="onDrop(event)"
    onclick="document.getElementById('fi').click()">
    <div class="ic">📊</div>
    <h3>Subir Excel del día</h3>
    <p>Arrastrá el archivo acá o hacé clic para seleccionarlo</p>
    <input type="file" id="fi" accept=".xlsx,.xls" style="display:none" onchange="onFile(this.files[0])">
  </div>

  <div class="finfo" id="finfo"></div>
  <button class="btn" id="pubBtn" disabled onclick="publicar()">📤 Procesar y publicar</button>
  <div class="status" id="status"></div>
  <div class="debug" id="debug"></div>
</div>

<script>
var OWNER='mruizaguirre', REPO='globalconnect-edn', FILE='data.json';
var parsed=null;

function log(msg){
  var el=document.getElementById('debug');
  el.style.display='block';
  el.textContent+=msg+'\n';
}

// Leer valor de celda por coordenada (ej: 'G9'). Retorna string limpio.
function cv(ws, coord){
  var cell=ws[coord];
  if(!cell||cell.v==null) return '';
  return String(cell.v).replace(/[\r\n]/g,' ').trim();
}
// Leer número de celda por coordenada
function cn(ws, coord){
  var cell=ws[coord];
  if(!cell||cell.v==null) return 0;
  var n=parseFloat(String(cell.v).replace(',','.'));
  return isNaN(n)?0:n;
}
// Calcular % doble (nunca leer la fórmula)
function pctDoble(two, total){
  return total>0 ? Math.round((two/total)*100) : 0;
}
// Convertir número de fila + letra de columna a coordenada A1
function coord(col, row){ return col+row; }

function onDrop(e){
  e.preventDefault();
  document.getElementById('drop').classList.remove('drag');
  onFile(e.dataTransfer.files[0]);
}

function onFile(file){
  if(!file) return;
  document.getElementById('debug').textContent='';
  var match=file.name.match(/(\d{2}-\d{2})/);
  var fecha='';
  if(match){
    var parts=match[1].split('-');
    var meses=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    fecha=parseInt(parts[0])+' de '+meses[parseInt(parts[1])]+' de 2026';
  } else {
    fecha=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  }
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      log('Pestañas: '+wb.SheetNames.join(' | '));
      var resumen=parseResumen(wb);
      var modulo=parseModulo(wb);
      var dormis=parseDormis(wb);
      parsed={resumen:resumen, modulo:modulo, dormis:dormis, fecha:fecha};
      var fi=document.getElementById('finfo');
      fi.style.display='block';
      fi.innerHTML='✅ <strong>'+file.name+'</strong> · '
        +resumen.alumnosUnicos+' alumnos únicos · '
        +resumen.carreras.length+' carreras · '
        +Object.keys(modulo).length+' cursos'
        +(dormis?' · '+dormis.totalAlumnos+' dormis':'');
      document.getElementById('pubBtn').disabled=false;
      showStatus('Archivo procesado. Revisá el log y publicá.','ok');
    }catch(err){
      showStatus('❌ Error: '+err.message,'err');
      log('ERROR: '+err.message+'\n'+err.stack);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ═══════════════════════════════════════════════════════════
// RESUMEN TOTAL — lee por coordenada de celda (A1 notation)
//
// Coordenadas fijas verificadas en el Excel real:
//   G4=alumnosUnicos, H4=unCurso, I4=dosCursos
//   B4='  Módulo A', C5-C8=nombres cursosA, D5-D8=n
//   B11='  Módulo B', C12-C15=nombres cursosB, D12-D15=n
//   C18='TOTAL GENERAL', D18=fórmula (calculamos manual)
//   G9='Carrera' (header), G10-G26=carrera, H=total, I=1c, J=2c
//   K tiene FÓRMULAS → siempre calculamos pct=J/H
// ═══════════════════════════════════════════════════════════
function parseResumen(wb){
  var sn=wb.SheetNames.find(function(n){return /resumen total/i.test(n)});
  if(!sn) throw new Error('No encontré pestaña "Resumen Total". Pestañas: '+wb.SheetNames.join(', '));
  log('Resumen Total → "'+sn+'"');
  var ws=wb.Sheets[sn];

  // Alumnos únicos — G4, H4, I4
  var alumnosUnicos=cn(ws,'G4');
  var unCurso=cn(ws,'H4');
  var dosCursos=cn(ws,'I4');
  log('alumnosUnicos='+alumnosUnicos+' unCurso='+unCurso+' dosCursos='+dosCursos);

  // Cursos Módulo A — filas 5-8, cols C (nombre) y D (n)
  var cursosA=[];
  ['5','6','7','8'].forEach(function(r){
    var nombre=cv(ws,'C'+r);
    var n=cn(ws,'D'+r);
    if(nombre && n>0) cursosA.push({nombre:nombre, n:n});
  });

  // Cursos Módulo B — filas 12-15, cols C y D
  var cursosB=[];
  ['12','13','14','15'].forEach(function(r){
    var nombre=cv(ws,'C'+r);
    var n=cn(ws,'D'+r);
    if(nombre && n>0) cursosB.push({nombre:nombre, n:n});
  });

  log('cursosA='+cursosA.length+' cursosB='+cursosB.length);

  // Total general (D18 es fórmula, calculamos)
  var totalGeneral=cursosA.reduce(function(s,c){return s+c.n},0)
                 +cursosB.reduce(function(s,c){return s+c.n},0);

  // Carreras — G10:G26, H=total, I=1curso, J=2cursos
  // (no leemos K porque tiene fórmulas)
  var carreras=[];
  for(var r=10; r<=30; r++){
    var nombre=cv(ws,'G'+r);
    if(!nombre) continue;
    if(/^(carrera|global|total)/i.test(nombre)) continue;
    var total=cn(ws,'H'+r);
    if(total<=0) continue;
    var one=cn(ws,'I'+r);
    var two=cn(ws,'J'+r);
    var pct=pctDoble(two, total);
    log('  carrera: '+nombre+' t='+total+' 1c='+one+' 2c='+two+' pct='+pct+'%');
    carreras.push({carrera:nombre, total:total, one:one, two:two, pct:pct});
  }
  log('Total carreras='+carreras.length);

  return{alumnosUnicos:alumnosUnicos, unCurso:unCurso, dosCursos:dosCursos,
         totalGeneral:totalGeneral, cursosA:cursosA, cursosB:cursosB, carreras:carreras};
}

// ═══════════════════════════════════════════════════════════
// RESUMEN POR MÓDULO — lee por coordenada también
//
// Estructura verificada:
//   F1 = título
//   F3 = 'Módulo A'  (col A)
//   F4 = 'Curso | Prof'  (col A, contiene '|')
//   F5 = header (Prioridad, Apellido, Nombre, Email, Carrera)
//   F6+ = alumnos: col A='1° Prioridad', B=apellido, C=nombre, D=email, E=carrera
//   siguiente módulo: col A = 'Módulo B'
// ═══════════════════════════════════════════════════════════
function parseModulo(wb){
  var sn=wb.SheetNames.find(function(n){return /resumen por m[oó]dulo/i.test(n)});
  if(!sn){ log('Sin pestaña módulos'); return {}; }
  log('Módulos → "'+sn+'"');
  var ws=wb.Sheets[sn];

  // Obtener rango de la hoja
  var range=XLSX.utils.decode_range(ws['!ref']||'A1:E500');
  var maxRow=range.e.r+1; // 1-indexed

  var cursos={}, cursoActual=null, modActual=null;

  for(var r=1; r<=maxRow; r++){
    var a=cv(ws,'A'+r);
    if(!a) continue;

    // Módulo A o B
    if(/^m[oó]dulo\s*a\s*$/i.test(a)){ modActual='A'; cursoActual=null; continue; }
    if(/^m[oó]dulo\s*b\s*$/i.test(a)){ modActual='B'; cursoActual=null; continue; }

    // Encabezado de curso: tiene '|' y no empieza con '1°'
    if(a.indexOf('|')>=0 && !/^1[°º]/i.test(a)){
      var parts=a.split('|');
      cursoActual=parts[0].trim();
      var prof=parts[1]?parts[1].trim():'';
      cursos[cursoActual]={modulo:modActual, profesor:prof, alumnos:[]};
      continue;
    }

    // Fila de alumno
    if(/^1[°º]/i.test(a) && cursoActual && cursos[cursoActual]){
      cursos[cursoActual].alumnos.push({
        apellido: cv(ws,'B'+r),
        nombre:   cv(ws,'C'+r),
        email:    cv(ws,'D'+r),
        carrera:  cv(ws,'E'+r)
      });
    }
  }
  log('Cursos: '+Object.keys(cursos).join(', '));
  return cursos;
}

// ═══════════════════════════════════════════════════════════
// DORMIS — lee por coordenada
//
// Resumen Dormis:
//   F5  = header bloques (col A='Bloque', B='Base Simple'...)
//   F6-F8 = datos por bloque
//   F9  = col A='TOTAL', B=baseSimple, C=baseDoble, D=totalReservas, E=fórmula
//   F4  = col H='Carrera', I='Cant. Alumnos', J='% del Total'
//   F5-F12 = carreras (col H=nombre, I=cant, J=fórmula)
//   F13 = col H='TOTAL', I=fórmula (totalAlumnos)
//
// Resumen con nombres:
//   F1  = título
//   F2  = header (Apellido y Nombre, Email, Bloque, Tipo Habitación, Acompañante, CARRERA)
//   F3+ = datos
// ═══════════════════════════════════════════════════════════
function parseDormis(wb){
  var snR=wb.SheetNames.find(function(n){return /resumen dormis/i.test(n)});
  var snN=wb.SheetNames.find(function(n){return /con nombres/i.test(n)});
  if(!snR&&!snN){ log('Sin pestañas dormis'); return null; }
  log('Dormis: resumen="'+(snR||'—')+'" nombres="'+(snN||'—')+'"');

  var baseSimple=0, baseDoble=0, totalRes=0, totalAlum=0;
  var bloques=[], carrerasDormis=[], alumnos=[];

  if(snR){
    var ws=wb.Sheets[snR];
    // Fila 9 = TOTAL de bloques
    baseSimple=cn(ws,'B9');
    baseDoble =cn(ws,'C9');
    totalRes  =cn(ws,'D9');
    // totalAlumnos = suma de alumnos por bloque (E9 es fórmula)
    totalAlum =cn(ws,'E6')+cn(ws,'E7')+cn(ws,'E8');
    if(!totalAlum) totalAlum=cn(ws,'E9'); // fallback si E9 tiene valor cacheado

    // Bloques: filas 6-8
    ['6','7','8'].forEach(function(r){
      var bloque=cv(ws,'A'+r);
      var bs=cn(ws,'B'+r), bd=cn(ws,'C'+r);
      if(bloque && (bs+bd)>0){
        bloques.push({bloque:bloque, simple:bs, doble:bd,
                      reservas:cn(ws,'D'+r), alumnos:cn(ws,'E'+r)});
      }
    });

    // Carreras dormis: filas 5-12, col H=nombre, I=cant
    // (col J tiene fórmulas → calcular pct desde I/totalAlum)
    var totalAlumDorm=totalAlum||1;
    for(var r=5; r<=12; r++){
      var nombre=cv(ws,'H'+r);
      if(!nombre || /^(carrera|total)/i.test(nombre)) continue;
      var cant=cn(ws,'I'+r);
      if(cant>0){
        carrerasDormis.push({carrera:nombre, cant:cant,
                             pct:Math.round(cant/totalAlumDorm*100)});
      }
    }
    // totalAlumnos real = suma de I5:I12
    if(!totalAlum){
      totalAlum=carrerasDormis.reduce(function(s,c){return s+c.cant},0);
    }
    log('Dormis bloques='+bloques.length+' carreras='+carrerasDormis.length+' totalAlum='+totalAlum);
  }

  if(snN){
    var ws2=wb.Sheets[snN];
    var range2=XLSX.utils.decode_range(ws2['!ref']||'A1:F100');
    var maxRow2=range2.e.r+1;
    // Fila 2 = header, filas 3+ = datos
    for(var r2=3; r2<=maxRow2; r2++){
      var nombre2=cv(ws2,'A'+r2);
      if(!nombre2) continue;
      alumnos.push({
        nombre:       nombre2,
        email:        cv(ws2,'B'+r2),
        bloque:       cv(ws2,'C'+r2),
        tipo:         cv(ws2,'D'+r2),
        acompanante:  cv(ws2,'E'+r2)||'',
        observaciones:cv(ws2,'F'+r2)||''
      });
    }
    log('Alumnos dormis='+alumnos.length);
  }

  return{baseSimple:baseSimple, baseDoble:baseDoble,
         totalReservas:totalRes, totalAlumnos:totalAlum,
         bloques:bloques, carreras:carrerasDormis, alumnos:alumnos};
}

// ═══════════════════════════════════════════════════════════
async function publicar(){
  var token=document.getElementById('token').value.trim();
  if(!token){ showStatus('⚠️ Ingresá tu GitHub Token primero.','err'); return; }
  if(!parsed){ showStatus('⚠️ Primero subí el Excel.','err'); return; }
  document.getElementById('pubBtn').disabled=true;
  showStatus('<span class="spin"></span> Publicando en GitHub...','loading');
  try{
    var content=btoa(unescape(encodeURIComponent(JSON.stringify(parsed,null,2))));
    var url='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+FILE;
    var sha=null;
    try{
      var r=await fetch(url,{headers:{Authorization:'token '+token}});
      if(r.ok){ var dd=await r.json(); sha=dd.sha; }
    }catch(e){}
    var body={message:'Actualización datos '+parsed.fecha, content:content};
    if(sha) body.sha=sha;
    var res=await fetch(url,{method:'PUT',
      headers:{Authorization:'token '+token,'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    if(!res.ok){ var er=await res.json(); throw new Error(er.message||res.statusText); }
    showStatus('✅ Dashboard actualizado con datos del <strong>'+parsed.fecha+'</strong>.<br>'
      +'Visible en 1-2 min en: <a href="https://'+OWNER+'.github.io/'+REPO+'/" target="_blank" style="color:#065F46">'
      +'https://'+OWNER+'.github.io/'+REPO+'/</a>','ok');
  }catch(err){
    showStatus('❌ Error al publicar: '+err.message,'err');
  }
  document.getElementById('pubBtn').disabled=false;
}

function showStatus(msg,type){
  var el=document.getElementById('status');
  el.className='status '+type;
  el.innerHTML=msg;
  el.style.display='block';
}
</script>
</body>
</html>
