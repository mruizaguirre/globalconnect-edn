<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Connect 2026 — EDN</title>
<style>
:root{--navy:#0A2540;--gold:#F2C94C;--bg:#F8F9FA;--border:#E9ECEF;--muted:#6C757D}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:#212529;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:32px 24px}
.hdr{background:var(--navy);border-radius:12px;padding:24px 32px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.hdr h1{color:#fff;font-size:20px;font-weight:700}
.hdr p{color:var(--gold);font-size:13px;margin-top:4px}
.badge{background:rgba(242,201,76,.2);border:1px solid rgba(242,201,76,.5);color:var(--gold);font-size:12px;font-weight:600;padding:6px 14px;border-radius:8px}
.dl-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px}
.dl-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.dl-pdf{background:var(--navy);color:var(--gold)}.dl-pdf:hover{background:#185FA5}
.dl-html{background:#fff;color:var(--navy);border:1px solid var(--border)}.dl-html:hover{background:#F0F2F5}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:20px}
.tab{background:#fff;border:1px solid var(--border);color:#495057;font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tab:hover{background:#E9ECEF}
.tab.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.pnl{display:none}.pnl.on{display:block}
.kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.kcard{background:var(--navy);border-radius:12px;padding:20px 22px;border-top:4px solid var(--gold)}
.klbl{color:rgba(255,255,255,.6);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kval{color:#fff;font-size:34px;font-weight:700;line-height:1}
.ksub{color:var(--gold);font-size:12px;margin-top:6px}
.card{background:#fff;border-radius:12px;padding:22px 24px;border:1px solid var(--border)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.stitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px;margin-bottom:16px}
.br{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bl{font-size:11px;color:#495057;width:260px;min-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bw{flex:1;background:#F0F2F5;border-radius:4px;height:20px}
.bf{height:20px;border-radius:4px;display:flex;align-items:center;padding-right:8px;justify-content:flex-end;min-width:28px}
.bn{font-size:11px;font-weight:700}
.mb{font-size:10px;padding:2px 7px;border-radius:10px;white-space:nowrap;font-weight:600}
.ma{background:#B5D4F4;color:#042C53}.mb2{background:#FAC775;color:#412402}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--navy);color:var(--gold);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;text-align:left}
tbody tr{border-bottom:1px solid #F0F2F5}
tbody tr:hover{background:#F8F9FA}
tbody td{padding:8px 14px}
.tr-total{background:var(--navy)!important}
.tr-total td{color:#fff!important;font-weight:700}
.tr-total td:first-child{color:var(--gold)!important}
.pb{display:flex;align-items:center;gap:8px}
.pt{flex:1;background:#F0F2F5;border-radius:3px;height:8px}
.pf{height:8px;border-radius:3px;background:var(--navy)}
.chdr{border-radius:10px;padding:18px 22px;margin-bottom:20px;background:var(--navy)}
.chdr.ca{border-left:5px solid #378ADD}.chdr.cb{border-left:5px solid #EF9F27}
.chdr h2{color:#fff;font-size:15px;font-weight:700}
.chdr p{color:rgba(255,255,255,.6);font-size:12px;margin-top:4px}
.cbadge{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:4px 14px;border-radius:20px}
.ca .cbadge{background:#378ADD;color:#fff}.cb .cbadge{background:#EF9F27;color:#412402}
.sbox{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:14px;outline:none}
.sbox:focus{border-color:var(--navy)}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
.ic{background:#F8F9FA;border-radius:8px;padding:14px}
.il{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.iv{font-size:13px;font-weight:600}
.is{font-size:12px;color:var(--muted);margin-top:3px}
.foot{text-align:center;color:#ADB5BD;font-size:11px;margin-top:32px;padding-top:20px;border-top:1px solid var(--border)}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.tabs,.dl-bar{display:none!important}.pnl{display:block!important}.hdr{border-radius:0}@page{margin:1.5cm;size:A4 landscape}}
@media(max-width:768px){.kpi4,.kpi3{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}.ig{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div><h1>🌐 Global Connect 2026</h1><p>Escuela de Negocios de San Andrés (EDN)</p></div>
    <div id="badge" class="badge">📅 Cargando...</div>
  </div>
  <div id="app"><div style="text-align:center;padding:60px"><div class="spin"></div><p style="color:var(--muted);font-size:13px">Cargando datos...</p></div></div>
  <div class="foot">Escuela de Negocios de San Andrés (EDN) · Global Connect 2026 · Confidencial — uso interno</div>
</div>
<script>
function q(sel){return document.querySelector(sel)}
function qq(sel){return document.querySelectorAll(sel)}

function showTab(id,btn){
  qq('.pnl').forEach(function(p){p.classList.remove('on')});
  qq('.tab').forEach(function(b){b.classList.remove('on')});
  var el=document.getElementById(id);
  if(el)el.classList.add('on');
  if(btn)btn.classList.add('on');
}

function filtrar(input,tid){
  var q2=input.value.toLowerCase();
  qq('#'+tid+' tbody tr').forEach(function(tr){
    tr.style.display=tr.textContent.toLowerCase().includes(q2)?'':'none';
  });
}

function descargarHTML(){
  var blob=new Blob([document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var f=q('#badge').textContent.replace('📅 Corte: ','').replace(/\s/g,'_');
  a.href=url; a.download='GlobalConnect_2026_'+f+'.html'; a.click();
  URL.revokeObjectURL(url);
}

async function init(){
  try{
    var r=await fetch('data.json?t='+Date.now());
    if(!r.ok)throw new Error('no data');
    var d=await r.json();
    render(d);
  }catch(e){
    q('#badge').textContent='📅 Sin datos';
    q('#app').innerHTML='<div class="card" style="text-align:center;padding:60px"><div style="font-size:48px;margin-bottom:16px">📊</div><h2 style="color:var(--navy);margin-bottom:8px">Dashboard en espera</h2><p style="color:var(--muted);font-size:13px">Los datos se actualizan diariamente.<br>Si ves este mensaje, aún no se cargaron los datos de hoy.</p></div>';
  }
}

function render(d){
  var rs=d.resumen, md=d.modulo||{}, dm=d.dormis||null;
  q('#badge').textContent='📅 Corte: '+d.fecha;

  var pD=rs.alumnosUnicos>0?Math.round(rs.dosCursos/rs.alumnosUnicos*100):0;
  var pU=100-pD;
  var sA=rs.cursosA.reduce(function(s,c){return s+c.n},0);
  var sB=rs.cursosB.reduce(function(s,c){return s+c.n},0);
  var tc=rs.cursosA.map(function(c){return{n:c.n,nombre:c.nombre,mod:'A'}})
    .concat(rs.cursosB.map(function(c){return{n:c.n,nombre:c.nombre,mod:'B'}}))
    .sort(function(a,b){return b.n-a.n});
  var mN=tc.length?tc[0].n:1, mC=rs.carreras.length?rs.carreras[0].total:1;
  var tA=rs.cursosA.slice().sort(function(a,b){return b.n-a.n})[0]||{};
  var tB=rs.cursosB.slice().sort(function(a,b){return b.n-a.n})[0]||{};
  var tC=rs.carreras[0]||{};
  var ck=Object.keys(md);

  // TABS
  var tabs='<button class="tab on" onclick="showTab(\'resumen\',this)">📊 Resumen</button>';
  if(dm)tabs+='<button class="tab" onclick="showTab(\'dormis\',this)">🏨 Dormis</button>';
  ck.forEach(function(n,i){
    var info=md[n];
    var s=n.length>20?n.substring(0,20)+'…':n;
    tabs+='<button class="tab" onclick="showTab(\'c'+i+'\',this)">'+info.modulo+' · '+s+'</button>';
  });

  // BARRAS CURSOS
  var bC=tc.map(function(c){
    var p=Math.round(c.n/mN*100);
    var col=c.mod==='A'?'#0A2540':'#EF9F27';
    var tc2=c.mod==='A'?'#F2C94C':'#412402';
    var mc=c.mod==='A'?'ma':'mb2';
    var l=c.nombre.length>26?c.nombre.substring(0,26)+'…':c.nombre;
    return '<div class="br"><div class="bl" title="'+c.nombre+'">'+l+'</div>'
      +'<span class="mb '+mc+'">Mód. '+c.mod+'</span>'
      +'<div class="bw"><div class="bf" style="width:'+p+'%;background:'+col+';">'
      +'<span class="bn" style="color:'+tc2+'">'+c.n+'</span></div></div></div>';
  }).join('')+'<div style="margin-top:14px;padding-top:12px;border-top:1px solid #F0F2F5;display:flex;gap:20px;font-size:12px;color:#6C757D">'
    +'<span>📘 Subtotal Módulo A: <strong style="color:#0A2540">'+sA+'</strong></span>'
    +'<span>📙 Subtotal Módulo B: <strong style="color:#BA7517">'+sB+'</strong></span></div>';

  // BARRAS CARRERAS
  var bK=rs.carreras.map(function(c){
    var p=Math.round(c.total/mC*100);
    var col=p>80?'#0A2540':p>55?'#185FA5':p>35?'#378ADD':p>15?'#85B7EB':'#B5D4F4';
    var tc2=p>50?'#fff':'#042C53';
    var l=c.carrera.length>38?c.carrera.substring(0,38)+'…':c.carrera;
    return '<div class="br"><div class="bl" title="'+c.carrera+'">'+l+'</div>'
      +'<div class="bw"><div class="bf" style="width:'+Math.max(p,3)+'%;background:'+col+';">'
      +'<span class="bn" style="color:'+tc2+'">'+c.total+'</span></div></div></div>';
  }).join('');

  // TABLA CARRERAS
  var tK=rs.carreras.map(function(c){
    var tot=c.one+c.two, pd=tot>0?Math.round(c.two/tot*100):0;
    var ps=c.pct?c.pct+'%':pd+'%';
    return '<tr><td>'+c.carrera+'</td><td style="text-align:center;font-weight:700">'+c.total+'</td>'
      +'<td style="text-align:center">'+c.one+'</td><td style="text-align:center">'+c.two+'</td>'
      +'<td><div class="pb"><div class="pt"><div class="pf" style="width:'+pd+'%"></div></div>'
      +'<span style="font-size:11px;color:#0A2540;font-weight:600;white-space:nowrap">'+ps+'</span></div></td></tr>';
  }).join('')+'<tr class="tr-total"><td>TOTAL GENERAL</td><td style="text-align:center">'+rs.alumnosUnicos+'</td>'
    +'<td style="text-align:center">'+rs.unCurso+'</td><td style="text-align:center">'+rs.dosCursos+'</td>'
    +'<td style="color:#F2C94C">'+pD+'% doble inscripción</td></tr>';

  // PANELES CURSOS
  var paneles=ck.map(function(nombre,i){
    var info=md[nombre];
    var mc=info.modulo==='A'?'ca':'cb';
    var filas=info.alumnos.map(function(a,idx){
      return '<tr><td style="color:#ADB5BD;font-size:11px;width:28px">'+(idx+1)+'</td>'
        +'<td>'+a.apellido+'</td><td>'+a.nombre+'</td><td>'+a.carrera+'</td>'
        +'<td style="color:#6C757D">'+a.email+'</td></tr>';
    }).join('');
    return '<div id="c'+i+'" class="pnl">'
      +'<div class="chdr '+mc+'"><h2>'+nombre+'</h2>'
      +'<p>Módulo '+info.modulo+(info.profesor?' · '+info.profesor:'')+'</p>'
      +'<span class="cbadge">'+info.alumnos.length+' inscriptos</span></div>'
      +'<div class="card">'
      +'<input class="sbox" type="text" placeholder="🔍 Buscar..." oninput="filtrar(this,\'ta'+i+'\')">'
      +'<div class="tw"><table id="ta'+i+'">'
      +'<thead><tr><th>#</th><th>Apellido</th><th>Nombre</th><th>Carrera</th><th>Email</th></tr></thead>'
      +'<tbody>'+filas+'</tbody></table></div></div></div>';
  }).join('');

  // PANEL DORMIS
  var pdh='';
  if(dm){
    var bR=dm.bloques.map(function(b){
      return '<tr><td>'+b.bloque+'</td>'
        +'<td style="text-align:center;font-weight:700">'+b.simple+'</td>'
        +'<td style="text-align:center;font-weight:700">'+b.doble+'</td>'
        +'<td style="text-align:center;font-weight:700">'+b.reservas+'</td>'
        +'<td style="text-align:center;font-weight:700">'+b.alumnos+'</td></tr>';
    }).join('')+'<tr class="tr-total"><td>TOTAL</td>'
      +'<td style="text-align:center">'+dm.baseSimple+'</td>'
      +'<td style="text-align:center">'+dm.baseDoble+'</td>'
      +'<td style="text-align:center">'+dm.totalReservas+'</td>'
      +'<td style="text-align:center">'+dm.totalAlumnos+'</td></tr>';

    var maxCd=dm.carreras.length?dm.carreras[0].cant:1;
    var cR=dm.carreras.map(function(c){
      var p=Math.round(c.cant/maxCd*100);
      return '<tr><td>'+c.carrera+'</td><td style="text-align:center;font-weight:700">'+c.cant+'</td>'
        +'<td><div class="pb"><div class="pt"><div class="pf" style="width:'+p+'%"></div></div>'
        +'<span style="font-size:11px;color:#0A2540;font-weight:600">'+c.pct+'%</span></div></td></tr>';
    }).join('');

    var aR=dm.alumnos.map(function(a,idx){
      var tb=/simple/i.test(a.tipo)
        ?'<span style="background:#B5D4F4;color:#042C53;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600">Simple</span>'
        :'<span style="background:#FAC775;color:#412402;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600">Doble</span>';
      return '<tr><td style="color:#ADB5BD;font-size:11px;width:28px">'+(idx+1)+'</td>'
        +'<td>'+a.nombre+'</td><td style="color:#6C757D">'+a.email+'</td>'
        +'<td>'+a.bloque+'</td><td>'+tb+'</td>'
        +'<td style="color:#495057">'+a.acompanante+'</td>'
        +'</tr>';
    }).join('');

    pdh='<div id="dormis" class="pnl">'
      +'<div class="kpi3">'
      +'<div class="kcard"><div class="klbl">Base Simple</div><div class="kval">'+dm.baseSimple+'</div><div class="ksub">reservas confirmadas</div></div>'
      +'<div class="kcard"><div class="klbl">Base Doble</div><div class="kval">'+dm.baseDoble+'</div><div class="ksub">reservas confirmadas</div></div>'
      +'<div class="kcard"><div class="klbl">Total Alumnos</div><div class="kval">'+dm.totalAlumnos+'</div><div class="ksub">'+dm.totalReservas+' reservas en total</div></div>'
      +'</div>'
      +'<div class="row2">'
      +'<div class="card"><div class="stitle">Reservas por Bloque</div>'
      +'<div class="tw"><table><thead><tr><th>Bloque</th><th style="text-align:center">Simple</th><th style="text-align:center">Doble</th><th style="text-align:center">Reservas</th><th style="text-align:center">Alumnos</th></tr></thead>'
      +'<tbody>'+bR+'</tbody></table></div></div>'
      +'<div class="card"><div class="stitle">Alumnos por Carrera</div>'
      +'<div class="tw"><table><thead><tr><th>Carrera</th><th style="text-align:center">Cant.</th><th style="width:140px">Proporción</th></tr></thead>'
      +'<tbody>'+cR+'</tbody></table></div></div>'
      +'</div>'
      +'<div class="card" style="margin-bottom:20px"><div class="stitle">Listado Nominal</div>'
      +'<input class="sbox" type="text" placeholder="🔍 Buscar por nombre, bloque o carrera..." oninput="filtrar(this,\'tdormis\')">'
      +'<div class="tw"><table id="tdormis"><thead><tr><th>#</th><th>Nombre</th><th>Email</th><th>Bloque</th><th>Tipo</th><th>Acompañante</th></tr></thead>'
      +'<tbody>'+aR+'</tbody></table></div></div>'
      +'</div>';
  }

  // RENDER
  q('#app').innerHTML=
    '<div class="dl-bar">'
    +'<button class="dl-btn dl-html" onclick="descargarHTML()">⬇️ Descargar HTML</button>'
    +'<button class="dl-btn dl-pdf" onclick="window.print()">🖨️ Imprimir / PDF</button>'
    +'</div>'
    +'<div class="tabs">'+tabs+'</div>'
    +'<div id="resumen" class="pnl on">'
    +'<div class="kpi4">'
    +'<div class="kcard"><div class="klbl">Alumnos Únicos</div><div class="kval">'+rs.alumnosUnicos+'</div><div class="ksub">Total inscriptos</div></div>'
    +'<div class="kcard"><div class="klbl">Inscripciones Totales</div><div class="kval">'+rs.totalGeneral+'</div><div class="ksub">1° Prioridad (Mód. A + B)</div></div>'
    +'<div class="kcard"><div class="klbl">Toman 2 Cursos</div><div class="kval">'+rs.dosCursos+'</div><div class="ksub">'+pD+'% del padrón</div></div>'
    +'<div class="kcard"><div class="klbl">Toman 1 Curso</div><div class="kval">'+rs.unCurso+'</div><div class="ksub">'+pU+'% del padrón</div></div>'
    +'</div>'
    +'<div class="row2">'
    +'<div class="card"><div class="stitle">Demanda por Curso — 1° Prioridad</div>'+bC+'</div>'
    +'<div class="card"><div class="stitle">Alumnos por Carrera</div>'+bK+'</div>'
    +'</div>'
    +'<div class="card" style="margin-bottom:20px"><div class="stitle">Detalle de Carreras</div>'
    +'<div class="tw"><table><thead><tr><th>Carrera</th><th style="text-align:center">Total</th><th style="text-align:center">1 Curso</th><th style="text-align:center">2 Cursos</th><th style="width:180px">% Doble</th></tr></thead>'
    +'<tbody>'+tK+'</tbody></table></div></div>'
    +'<div class="card" style="border-left:4px solid #F2C94C;margin-bottom:20px"><div class="stitle">Insights Clave</div>'
    +'<div class="ig">'
    +'<div class="ic"><div class="il">🏆 Curso top Mód. A</div><div class="iv">'+(tA.nombre||'—')+'</div><div class="is">'+(tA.n||'—')+' inscriptos</div></div>'
    +'<div class="ic"><div class="il">🏆 Curso top Mód. B</div><div class="iv">'+(tB.nombre||'—')+'</div><div class="is">'+(tB.n||'—')+' inscriptos</div></div>'
    +'<div class="ic"><div class="il">📈 Carrera principal</div><div class="iv">'+(tC.carrera||'—')+'</div><div class="is">'+(tC.total||'—')+' alumnos</div></div>'
    +'</div></div>'
    +'</div>'
    +paneles
    +pdh;
}

init();
</script>
</body>
</html>
