<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Connect 2026 — EDN</title>
<style>
  :root { --navy:#0A2540; --gold:#F2C94C; --bg:#F8F9FA; --border:#E9ECEF; --muted:#6C757D; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Arial,sans-serif; background:var(--bg); color:#212529; font-size:14px; }
  .container { max-width:1100px; margin:0 auto; padding:32px 24px; }
  .header { background:var(--navy); border-radius:12px; padding:24px 32px; margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .header h1 { color:#fff; font-size:20px; font-weight:700; }
  .header p { color:var(--gold); font-size:13px; margin-top:4px; }
  .date-badge { background:rgba(242,201,76,.2); border:1px solid rgba(242,201,76,.5); color:var(--gold); font-size:12px; font-weight:600; padding:6px 14px; border-radius:8px; }
  .tab-nav { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:20px; }
  .tab-btn { background:#fff; border:1px solid var(--border); color:#495057; font-size:12px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer; white-space:nowrap; transition:all .15s; }
  .tab-btn:hover { background:#E9ECEF; }
  .tab-btn.active { background:var(--navy); color:var(--gold); border-color:var(--navy); }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
  .kpi-grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
  .kpi-card { background:var(--navy); border-radius:12px; padding:20px 22px; border-top:4px solid var(--gold); }
  .kpi-label { color:rgba(255,255,255,.6); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .kpi-value { color:#fff; font-size:34px; font-weight:700; line-height:1; }
  .kpi-detail { color:var(--gold); font-size:12px; margin-top:6px; }
  .card { background:#fff; border-radius:12px; padding:22px 24px; border:1px solid var(--border); }
  .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  .section-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); border-left:3px solid var(--gold); padding-left:10px; margin-bottom:16px; }
  .bar-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .bar-label { font-size:11px; color:#495057; width:260px; min-width:260px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-wrap { flex:1; background:#F0F2F5; border-radius:4px; height:20px; }
  .bar-fill { height:20px; border-radius:4px; display:flex; align-items:center; padding-right:8px; justify-content:flex-end; min-width:28px; }
  .bar-num { font-size:11px; font-weight:700; }
  .mod-badge { font-size:10px; padding:2px 7px; border-radius:10px; white-space:nowrap; font-weight:600; }
  .mod-a { background:#B5D4F4; color:#042C53; }
  .mod-b { background:#FAC775; color:#412402; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  thead th { background:var(--navy); color:var(--gold); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:10px 14px; text-align:left; }
  tbody tr { border-bottom:1px solid #F0F2F5; }
  tbody tr:hover { background:#F8F9FA; }
  tbody td { padding:8px 14px; }
  .total-row { background:var(--navy) !important; }
  .total-row td { color:#fff !important; font-weight:700; }
  .total-row td:first-child { color:var(--gold) !important; }
  .pct-bar { display:flex; align-items:center; gap:8px; }
  .pct-track { flex:1; background:#F0F2F5; border-radius:3px; height:8px; }
  .pct-fill-bar { height:8px; border-radius:3px; background:var(--navy); }
  .curso-header { border-radius:10px; padding:18px 22px; margin-bottom:20px; background:var(--navy); }
  .curso-header.mod-a { border-left:5px solid #378ADD; }
  .curso-header.mod-b { border-left:5px solid #EF9F27; }
  .curso-header h2 { color:#fff; font-size:15px; font-weight:700; }
  .curso-header p { color:rgba(255,255,255,.6); font-size:12px; margin-top:4px; }
  .count-badge { display:inline-block; margin-top:10px; font-size:13px; font-weight:700; padding:4px 14px; border-radius:20px; }
  .mod-a .count-badge { background:#378ADD; color:#fff; }
  .mod-b .count-badge { background:#EF9F27; color:#412402; }
  .search-box { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; margin-bottom:14px; outline:none; }
  .search-box:focus { border-color:var(--navy); }
  .insights-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:8px; }
  .insight-card { background:#F8F9FA; border-radius:8px; padding:14px; }
  .insight-label { font-size:11px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  .insight-value { font-size:13px; font-weight:600; }
  .insight-sub { font-size:12px; color:var(--muted); margin-top:3px; }

  .download-bar { display:flex; justify-content:flex-end; gap:8px; margin-bottom:16px; }
  .dl-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; border:none; transition:all .15s; }
  .dl-btn-pdf { background:var(--navy); color:var(--gold); }
  .dl-btn-pdf:hover { background:#185FA5; }
  .dl-btn-html { background:#fff; color:var(--navy); border:1px solid var(--border); }
  .dl-btn-html:hover { background:#F0F2F5; }

  .footer { text-align:center; color:#ADB5BD; font-size:11px; margin-top:32px; padding-top:20px; border-top:1px solid var(--border); }
  .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--navy); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media print {
    body { background:#fff; }
    .tab-nav { display:none !important; }
    .tab-panel { display:block !important; page-break-before:auto; }
    .download-bar { display:none !important; }
    .header { border-radius:0; }
    .card { break-inside:avoid; margin-bottom:12px; }
    .kpi-grid { break-inside:avoid; }
    .charts-row { grid-template-columns:1fr 1fr; }
    @page { margin:1.5cm; size:A4 landscape; }
  }

  @media(max-width:768px) { .kpi-grid{grid-template-columns:repeat(2,1fr)} .kpi-grid-3{grid-template-columns:repeat(2,1fr)} .charts-row{grid-template-columns:1fr} .insights-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1>🌐 Global Connect 2026</h1><p>Escuela de Negocios de San Andrés (EDN)</p></div>
    <div id="date-badge" class="date-badge">📅 Cargando datos...</div>
  </div>
  <div id="contenido">
    <div style="text-align:center;padding:60px"><div class="spinner"></div><p style="color:var(--muted);font-size:13px">Cargando datos...</p></div>
  </div>
  <div class="footer">
    <p>Escuela de Negocios de San Andrés (EDN) · Global Connect 2026 · Confidencial — uso interno</p>
  </div>
</div>

<script>

function descargarHTML() {
  var html = document.documentElement.outerHTML;
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var fecha = document.getElementById('date-badge').textContent.replace('📅 Corte: ','').replace(/\s/g,'_') || 'reporte';
  a.href = url;
  a.download = 'GlobalConnect_2026_' + fecha + '.html';
  a.click();
  URL.revokeObjectURL(url);
}

async function cargarDatos() {
  try {
    const r = await fetch('data.json?t=' + Date.now());
    if (!r.ok) throw new Error('Sin datos');
    const d = await r.json();
    try {
      renderDashboard(d.resumen, d.modulo || {}, d.fecha, (d && d.dormis) ? d.dormis : null);
    } catch(renderErr) {
      document.getElementById('date-badge').textContent = '📅 Error al renderizar';
      document.getElementById('contenido').innerHTML =
        '<div class="card" style="border-left:4px solid #dc3545;padding:20px"><strong style="color:#dc3545">⚠️ Error al mostrar los datos</strong><br><span style="font-size:12px;color:#6C757D">' + renderErr.message + '</span></div>';
    }
  } catch(e) {
    document.getElementById('date-badge').textContent = '📅 Sin datos cargados';
    document.getElementById('contenido').innerHTML =
      '<div class="card" style="text-align:center;padding:60px"><div style="font-size:48px;margin-bottom:16px">📊</div><h2 style="color:var(--navy);margin-bottom:8px">Dashboard en espera</h2><p style="color:var(--muted);font-size:13px">Los datos se actualizan diariamente.</p></div>';
  }
}

function renderDashboard(data, modData, fecha, dormisData) {
  document.getElementById('date-badge').textContent = '📅 Corte: ' + fecha;

  var pctDos = data.alumnosUnicos > 0 ? Math.round(data.dosCursos / data.alumnosUnicos * 100) : 0;
  var pctUno = 100 - pctDos;
  var subtA = data.cursosA.reduce(function(s,c){ return s+c.n; }, 0);
  var subtB = data.cursosB.reduce(function(s,c){ return s+c.n; }, 0);
  var todosCursos = data.cursosA.map(function(c){ return Object.assign({},c,{mod:'A'}); })
    .concat(data.cursosB.map(function(c){ return Object.assign({},c,{mod:'B'}); }))
    .sort(function(a,b){ return b.n-a.n; });
  var maxN = todosCursos.length ? todosCursos[0].n : 1;
  var maxC = data.carreras.length ? data.carreras[0].total : 1;
  var topA = data.cursosA.slice().sort(function(a,b){return b.n-a.n;})[0] || {};
  var topB = data.cursosB.slice().sort(function(a,b){return b.n-a.n;})[0] || {};
  var topC = data.carreras[0] || {};

  // TAB BUTTONS
  var tabBtns = '<button class="tab-btn active" onclick="showTab(\'resumen\',this)">📊 Resumen</button>';
  var cursoKeys = Object.keys(modData);
  cursoKeys.forEach(function(nombre, i) {
    var info = modData[nombre];
    var short = nombre.length > 20 ? nombre.substring(0,20)+'…' : nombre;
    tabBtns += '<button class="tab-btn" onclick="showTab(\'curso-'+i+'\',this)">'+info.modulo+' · '+short+'</button>';
  });
  if (dormisData) {
    tabBtns += '<button class="tab-btn" onclick="showTab(\'dormis\',this)">🏨 Dormis</button>';
  }

  // BARRAS CURSOS
  var barsCursos = todosCursos.map(function(c) {
    var pct = Math.round(c.n / maxN * 100);
    var color = c.mod === 'A' ? '#0A2540' : '#EF9F27';
    var tc = c.mod === 'A' ? '#F2C94C' : '#412402';
    var mc = c.mod === 'A' ? 'mod-a' : 'mod-b';
    var lbl = c.nombre.length > 26 ? c.nombre.substring(0,26)+'…' : c.nombre;
    return '<div class="bar-row"><div class="bar-label" title="'+c.nombre+'">'+lbl+'</div>'
      +'<span class="mod-badge '+mc+'">Mód. '+c.mod+'</span>'
      +'<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%;background:'+color+';">'
      +'<span class="bar-num" style="color:'+tc+'">'+c.n+'</span></div></div></div>';
  }).join('');
  barsCursos += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid #F0F2F5;display:flex;gap:20px;font-size:12px;color:#6C757D;">'
    +'<span>📘 Subtotal Módulo A: <strong style="color:#0A2540">'+subtA+'</strong></span>'
    +'<span>📙 Subtotal Módulo B: <strong style="color:#BA7517">'+subtB+'</strong></span></div>';

  // BARRAS CARRERAS
  var barsCarreras = data.carreras.map(function(c) {
    var pct = Math.round(c.total / maxC * 100);
    var color = pct>80?'#0A2540':pct>55?'#185FA5':pct>35?'#378ADD':pct>15?'#85B7EB':'#B5D4F4';
    var tc = pct > 50 ? '#fff' : '#042C53';
    var lbl = c.carrera.length > 38 ? c.carrera.substring(0,38)+'…' : c.carrera;
    return '<div class="bar-row"><div class="bar-label" title="'+c.carrera+'">'+lbl+'</div>'
      +'<div class="bar-wrap"><div class="bar-fill" style="width:'+Math.max(pct,3)+'%;background:'+color+';">'
      +'<span class="bar-num" style="color:'+tc+'">'+c.total+'</span></div></div></div>';
  }).join('');

  // TABLA CARRERAS
  var tablaRows = data.carreras.map(function(c) {
    var tot = c.one + c.two;
    var pctD = tot > 0 ? Math.round(c.two / tot * 100) : 0;
    var pctShow = c.pct ? Math.round(c.pct*100)+'%' : pctD+'%';
    return '<tr><td>'+c.carrera+'</td>'
      +'<td style="text-align:center;font-weight:700">'+c.total+'</td>'
      +'<td style="text-align:center">'+c.one+'</td>'
      +'<td style="text-align:center">'+c.two+'</td>'
      +'<td><div class="pct-bar"><div class="pct-track"><div class="pct-fill-bar" style="width:'+pctD+'%"></div></div>'
      +'<span style="font-size:11px;color:#0A2540;font-weight:600;white-space:nowrap">'+pctShow+'</span></div></td></tr>';
  }).join('');
  tablaRows += '<tr class="total-row"><td>TOTAL GENERAL</td>'
    +'<td style="text-align:center">'+data.alumnosUnicos+'</td>'
    +'<td style="text-align:center">'+data.unCurso+'</td>'
    +'<td style="text-align:center">'+data.dosCursos+'</td>'
    +'<td style="color:#F2C94C">'+pctDos+'% doble inscripción</td></tr>';

  // PANELES CURSOS
  var paneles = cursoKeys.map(function(nombre, i) {
    var info = modData[nombre];
    var mc = info.modulo === 'A' ? 'mod-a' : 'mod-b';
    var filas = info.alumnos.map(function(a, idx) {
      return '<tr><td style="color:#ADB5BD;font-size:11px;width:32px">'+(idx+1)+'</td>'
        +'<td>'+a.apellido+'</td><td>'+a.nombre+'</td>'
        +'<td>'+a.carrera+'</td><td style="color:#6C757D">'+a.email+'</td></tr>';
    }).join('');
    return '<div id="curso-'+i+'" class="tab-panel">'
      +'<div class="curso-header '+mc+'"><h2>'+nombre+'</h2>'
      +'<p>Módulo '+info.modulo+(info.profesor ? ' · '+info.profesor : '')+'</p>'
      +'<span class="count-badge">'+info.alumnos.length+' inscriptos</span></div>'
      +'<div class="card">'
      +'<input class="search-box" type="text" placeholder="🔍 Buscar por apellido, nombre o carrera..." oninput="filtrar(this,\'t'+i+'\')">'
      +'<div class="table-wrap"><table id="t'+i+'">'
      +'<thead><tr><th>#</th><th>Apellido</th><th>Nombre</th><th>Carrera</th><th>Email</th></tr></thead>'
      +'<tbody>'+filas+'</tbody></table></div></div></div>';
  }).join('');

  // PANEL DORMIS
  var dormisPanelHtml = '';
  if (dormisData) {
    var d = dormisData;

    // Filas de bloques
    var blqRows = (d.bloques||[]).map(function(b) {
      return '<tr><td>'+b.bloque+'</td>'
        +'<td style="text-align:center;font-weight:700">'+b.simple+'</td>'
        +'<td style="text-align:center;font-weight:700">'+b.doble+'</td>'
        +'<td style="text-align:center;font-weight:700">'+b.reservas+'</td>'
        +'<td style="text-align:center;font-weight:700">'+b.alumnos+'</td></tr>';
    }).join('');

    // Filas de carreras
    var maxCant = d.carreras && d.carreras.length ? d.carreras[0].cant : 1;
    var carrRows = (d.carreras||[]).map(function(c) {
      var pct = Math.round(c.cant/maxCant*100);
      return '<tr><td>'+c.carrera+'</td>'
        +'<td style="text-align:center;font-weight:700">'+c.cant+'</td>'
        +'<td><div class="pct-bar"><div class="pct-track"><div class="pct-fill-bar" style="width:'+pct+'%"></div></div>'
        +'<span style="font-size:11px;color:#0A2540;font-weight:600">'+c.pct+'%</span></div></td></tr>';
    }).join('');

    // Filas de alumnos
    var nomRows = (d.alumnos||[]).map(function(a, idx) {
      var tipoBadge = /simple/i.test(a.tipo)
        ? '<span style="background:#B5D4F4;color:#042C53;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600">Simple</span>'
        : '<span style="background:#FAC775;color:#412402;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600">Doble</span>';
      return '<tr>'
        +'<td style="color:#ADB5BD;font-size:11px;width:28px">'+(idx+1)+'</td>'
        +'<td>'+a.nombre+'</td>'
        +'<td style="color:#6C757D">'+a.email+'</td>'
        +'<td>'+a.bloque+'</td>'
        +'<td>'+tipoBadge+'</td>'
        +'<td style="color:#495057">'+a.acompanante+'</td>'
        +'<td style="color:#6C757D;font-size:11px">'+a.observaciones+'</td>'
        +'</tr>';
    }).join('');

    dormisPanelHtml = '<div id="dormis" class="tab-panel">'
      // KPIs
      +'<div class="kpi-grid-3">'
      +'<div class="kpi-card"><div class="kpi-label">Base Simple</div><div class="kpi-value">'+d.baseSimple+'</div><div class="kpi-detail">reservas confirmadas</div></div>'
      +'<div class="kpi-card"><div class="kpi-label">Base Doble</div><div class="kpi-value">'+d.baseDoble+'</div><div class="kpi-detail">reservas confirmadas</div></div>'
      +'<div class="kpi-card"><div class="kpi-label">Total Alumnos</div><div class="kpi-value">'+d.totalAlumnos+'</div><div class="kpi-detail">'+d.totalReservas+' reservas en total</div></div>'
      +'</div>'
      // Tabla bloques
      +'<div class="charts-row">'
      +'<div class="card"><div class="section-title">Reservas por Bloque</div>'
      +'<div class="table-wrap"><table>'
      +'<thead><tr><th>Bloque</th><th style="text-align:center">Simple</th><th style="text-align:center">Doble</th><th style="text-align:center">Reservas</th><th style="text-align:center">Alumnos</th></tr></thead>'
      +'<tbody>'+blqRows
      +'<tr class="total-row"><td>TOTAL</td>'
      +'<td style="text-align:center">'+d.baseSimple+'</td>'
      +'<td style="text-align:center">'+d.baseDoble+'</td>'
      +'<td style="text-align:center">'+d.totalReservas+'</td>'
      +'<td style="text-align:center">'+d.totalAlumnos+'</td>'
      +'</tr></tbody></table></div></div>'
      // Tabla carreras
      +'<div class="card"><div class="section-title">Alumnos por Carrera</div>'
      +'<div class="table-wrap"><table>'
      +'<thead><tr><th>Carrera</th><th style="text-align:center">Cant.</th><th style="width:140px">Proporción</th></tr></thead>'
      +'<tbody>'+carrRows+'</tbody></table></div></div>'
      +'</div>'
      // Listado nominal
      +'<div class="card" style="margin-bottom:20px">'
      +'<div class="section-title">Listado Nominal de Alumnos con Dormi</div>'
      +'<input class="search-box" type="text" placeholder="🔍 Buscar por nombre, bloque o carrera..." oninput="filtrar(this,&quot;tdormis&quot;)">'
      +'<div class="table-wrap"><table id="tdormis">'
      +'<thead><tr><th>#</th><th>Nombre</th><th>Email</th><th>Bloque</th><th>Tipo</th><th>Acompañante</th><th>Observaciones</th></tr></thead>'
      +'<tbody>'+nomRows+'</tbody></table></div></div>'
      +'</div>';
  }

  // RENDER FINAL
  document.getElementById('contenido').innerHTML =
    '<div class="tab-nav">'+tabBtns+'</div>'
    +'<div class="download-bar">'
    +'<button class="dl-btn dl-btn-html" onclick="descargarHTML()">⬇️ Descargar HTML</button>'
    +'<button class="dl-btn dl-btn-pdf" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>'
    +'</div>'
    +'<div id="resumen" class="tab-panel active">'
    +'<div class="kpi-grid">'
    +'<div class="kpi-card"><div class="kpi-label">Alumnos Únicos</div><div class="kpi-value">'+data.alumnosUnicos+'</div><div class="kpi-detail">Total inscriptos</div></div>'
    +'<div class="kpi-card"><div class="kpi-label">Inscripciones Totales</div><div class="kpi-value">'+data.totalGeneral+'</div><div class="kpi-detail">1° Prioridad (Mód. A + B)</div></div>'
    +'<div class="kpi-card"><div class="kpi-label">Toman 2 Cursos</div><div class="kpi-value">'+data.dosCursos+'</div><div class="kpi-detail">'+pctDos+'% del padrón</div></div>'
    +'<div class="kpi-card"><div class="kpi-label">Toman 1 Curso</div><div class="kpi-value">'+data.unCurso+'</div><div class="kpi-detail">'+pctUno+'% del padrón</div></div>'
    +'</div>'
    +'<div class="charts-row">'
    +'<div class="card"><div class="section-title">Demanda por Curso — 1° Prioridad</div>'+barsCursos+'</div>'
    +'<div class="card"><div class="section-title">Alumnos por Carrera</div>'+barsCarreras+'</div>'
    +'</div>'
    +'<div class="card" style="margin-bottom:20px">'
    +'<div class="section-title">Detalle de Carreras — Inscripciones y Perfil de Cursada</div>'
    +'<div class="table-wrap"><table>'
    +'<thead><tr><th>Carrera</th><th style="text-align:center">Total</th><th style="text-align:center">1 Curso</th><th style="text-align:center">2 Cursos</th><th style="width:180px">% Doble inscripción</th></tr></thead>'
    +'<tbody>'+tablaRows+'</tbody></table></div></div>'
    +'<div class="card" style="border-left:4px solid #F2C94C;margin-bottom:20px">'
    +'<div class="section-title">Insights Clave del Período</div>'
    +'<div class="insights-grid">'
    +'<div class="insight-card"><div class="insight-label">🏆 Curso top Mód. A</div><div class="insight-value">'+(topA.nombre||'—')+'</div><div class="insight-sub">'+(topA.n||'—')+' inscriptos</div></div>'
    +'<div class="insight-card"><div class="insight-label">🏆 Curso top Mód. B</div><div class="insight-value">'+(topB.nombre||'—')+'</div><div class="insight-sub">'+(topB.n||'—')+' inscriptos</div></div>'
    +'<div class="insight-card"><div class="insight-label">📈 Carrera principal</div><div class="insight-value">'+(topC.carrera||'—')+'</div><div class="insight-sub">'+(topC.total||'—')+' alumnos</div></div>'
    +'</div></div>'
    +'</div>'
    + paneles
    + dormisPanelHtml;
}

function showTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  if (btn) btn.classList.add('active');
}

function filtrar(input, tid) {
  var q = input.value.toLowerCase();
  document.querySelectorAll('#'+tid+' tbody tr').forEach(function(tr){
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

cargarDatos();
